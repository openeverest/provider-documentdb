apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance
spec:
  providerRef:
    name: documentdb
  # The upgrade-version step moves it to 1.0.1.
  version: "1.0.0"
  topology:
    type: replicaSet
  components:
    engine:
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
      storage:
        size: 10Gi
  parameters:
    backup:
      schedule: "0 2 * * *"
      retentionDays: 7
