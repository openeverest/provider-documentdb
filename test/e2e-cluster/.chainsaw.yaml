---
# Chainsaw configuration of the e2e-cluster suites, which run against the real
# DocumentDB operator. See https://kyverno.github.io/chainsaw/latest/configuration/.
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: e2e-cluster
spec:
  timeouts:
    apply: 60s
    assert: 5m
    delete: 5m
    error: 5m
    exec: 5m
    cleanup: 5m
  execution:
    # The suites start several PostgreSQL pods each; one at a time fits a CI runner.
    parallel: 1
  cleanup:
    skipDelete: false
  report:
    format: XML
    name: chainsaw-report
    path: /tmp
