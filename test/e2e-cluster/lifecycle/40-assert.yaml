apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: docdb
(metadata.generation == status.observedGeneration): true
status:
  phase: Provisioned
  (conditions[?type == 'Ready'].status | [0]): "True"
  (components[?name == 'engine'] | [0].readyReplicas): 3
---
apiVersion: documentdb.io/v1
kind: DocumentDB
metadata:
  name: docdb
spec:
  resource:
    cpu: 600m
    memory: 1536Mi
---
# Without a gateway CPU limit in the operator configuration, PostgreSQL gets
# the whole CPU envelope.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: docdb
spec:
  resources:
    limits:
      cpu: 600m
status:
  readyInstances: 3
