apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: example
spec:
  providerRef:
    name: documentdb
  topology:
    type: replicaSet
  components:
    engine:
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
      storage:
        size: 10Gi
  parameters:
    bootstrap:
      backup:
        name: other-backup
