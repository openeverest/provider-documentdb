apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: example
spec:
  providerRef:
    name: documentdb
  topology:
    type: replicaSet
  components:
    engine:
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
      storage:
        size: 10Gi
      schedulingPolicy:
        nodeSelector:
          disk: ssd
      service:
        serviceType: LoadBalancer
  userSecretRef:
    name: my-credentials
  parameters:
    tls:
      issuer:
        name: other-issuer
        kind: ClusterIssuer
      additionalNames:
        - db.example.com
    backup:
      schedule: "0 2 * * *"
      retentionDays: 7
    bootstrap:
      backup:
        name: my-backup
