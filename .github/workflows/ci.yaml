---
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when a new commit arrives.
# On main we let runs queue so every commit is validated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Compile directly — `make build` runs generation which is checked by the
      # verify job; we only want to know the code compiles here.
      - name: Compile binary
        run: go build -o /dev/null ./cmd/provider

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test-unit

  verify:
    name: Verify generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check generated files are up-to-date
        run: make verify

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Lint Helm chart
        run: helm lint charts/provider-documentdb

  # Each integration suite runs as a separate job through the reusable
  # integration-test.yaml workflow. To add a suite, create a directory under
  # test/integration/, add a matching test-integration-<suite> Make target,
  # and copy this job with the new make_target.
  test-integration-core:
    name: Integration / core
    needs: [lint, build, verify]
    uses: ./.github/workflows/integration-test.yaml
    with:
      make_target: test-integration-core
      suite: core
    secrets: inherit

  # End-to-end suites against the real DocumentDB operator and CloudNativePG,
  # through the reusable e2e-cluster-test.yaml workflow. The lifecycle suite
  # runs in both image modes: auto, which picks ImageVolume on the k3s 1.35
  # cluster, and the combined image.
  test-e2e-cluster-lifecycle:
    name: E2E cluster / lifecycle (ImageVolume)
    needs: [lint, build, verify]
    uses: ./.github/workflows/e2e-cluster-test.yaml
    with:
      make_target: test-e2e-cluster-lifecycle
      suite: lifecycle-imagevolume
      operator_image_mode: auto
      expected_image_mode: imageVolume

  test-e2e-cluster-lifecycle-combined:
    name: E2E cluster / lifecycle (combined image)
    needs: [lint, build, verify]
    uses: ./.github/workflows/e2e-cluster-test.yaml
    with:
      make_target: test-e2e-cluster-lifecycle
      suite: lifecycle-combined
      operator_image_mode: combined
      expected_image_mode: combined

  test-e2e-cluster-tls:
    name: E2E cluster / TLS
    needs: [lint, build, verify]
    uses: ./.github/workflows/e2e-cluster-test.yaml
    with:
      make_target: test-e2e-cluster-tls
      suite: tls
