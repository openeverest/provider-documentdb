# Create form of the user Secret, opened from the "Database user" field.
# Paths are keys of the Secret's data.
label: "Database user"
description: "Credentials of the administrator created with the database."
components:
  username:
    uiType: text
    path: username
    fieldParams:
      label: "Username"
      defaultValue: everest
    validation:
      required: true
  password:
    uiType: text
    path: password
    fieldParams:
      label: "Password"
      type: password
    validation:
      required: true
componentsOrder:
  - username
  - password
