apiVersion: v2
name: provider-documentdb
description: A Helm chart for deploying the OpenEverest DocumentDB provider
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - openeverest
  - documentdb
  - mongodb
  - provider
  - database
home: https://github.com/openeverest/provider-documentdb
sources:
  - https://github.com/openeverest/provider-documentdb
maintainers:
  - name: OpenEverest Contributors
# OpenEverest (operator + CRDs) and cert-manager must be installed before this chart.
dependencies:
  - name: documentdb-operator
    alias: operator
    version: "1.2.1"
    repository: oci://ghcr.io/documentdb
    condition: operator.enabled
annotations:
  openeverest.io/contract-version: "2.0.0-alpha.1.next"
  # The API versions this chart needs the cluster to serve, which provider-sdk
  # renders it with: the operator chart refuses to render without cert-manager's.
  openeverest.io/api-versions: cert-manager.io/v1/Certificate
