# Default values for provider-documentdb.

# -- Number of replicas for the provider deployment
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/openeverest/provider-documentdb
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Automount API credentials for the service account
  automountServiceAccountToken: true
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # -- Specifies whether RBAC resources should be created
  create: true

# -- Annotations to add to the deployment pods
podAnnotations: {}

# -- Labels to add to the deployment pods
podLabels: {}

podSecurityContext:
  # -- Run as non-root
  runAsNonRoot: true
  # -- Security context fsGroup
  fsGroup: 65534

securityContext:
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Drop all capabilities
  capabilities:
    drop:
      - ALL
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Run as user ID
  runAsUser: 65534

service:
  # -- Service type
  type: ClusterIP
  # -- Service port for the HTTP server (health endpoints)
  port: 8082
  # -- The address the metrics endpoint binds to. Use "0" to disable.
  metricsBindAddress: ":8081"

# -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Deployment update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

# -- Number of old ReplicaSets to retain
revisionHistoryLimit: 1

# -- Termination grace period in seconds
terminationGracePeriodSeconds: 10

# -- Topology spread constraints for pod scheduling
topologySpreadConstraints: []

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

provider:
  # -- The name to register for the Provider custom resource.
  # Must match `name` in definition/provider.yaml and common.ProviderName.
  name: documentdb
  # -- Short identifier for the provider, used in resource names
  # This appears in preset names (e.g., '<shortName>-replicaset') and can be
  # used in other contexts where a short concise provider identifier is needed.
  shortName: documentdb

# -- Default cluster instance presets configuration
# Each preset must have 'name', 'enabled', and 'spec' fields.
# The 'spec' field contains the full ClusterInstancePresetSpec.
# Note: The provider shortName will be automatically added to each preset name.
presets:
  - name: replicaset
    enabled: true
    spec:
      providerRef:
        name: documentdb
      version: 1.0.1
      topology:
        type: replicaSet
      components:
        engine:
          replicas: 3
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          storage:
            size: 25Gi
            # storageClass: ""  # Specify a storage class if you want to set the default
          service:
            serviceType: ClusterIP

# -- Additional environment variables to set on the provider container
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# -- Additional volume mounts to add to the provider container
extraVolumeMounts: []

# -- Additional volumes to add to the pod
extraVolumes: []

admission:
  # -- PEM serving certificate for the Instance admission webhook. Left empty,
  # the chart generates one and keeps it across upgrades.
  certs:
    tls.crt: ""
    tls.key: ""
    ca.crt: ""
  certManager:
    # -- Issue the serving certificate with cert-manager, which must be installed.
    enabled: false

# -- Leader election configuration
leaderElection:
  # -- Enable leader election (recommended for HA deployments)
  enabled: true

# -- Values for the DocumentDB operator subchart.
# See https://github.com/documentdb/documentdb-kubernetes-operator/tree/main/operator/documentdb-helm-chart for all options.
operator:
  # -- Install the DocumentDB operator with the provider. Set to false when the
  # operator is installed separately, in the version this chart pins.
  enabled: true
  # -- Namespace of the operator. Empty installs it in the release namespace.
  namespace: ""
  # The operator chart bundles the CloudNativePG operator, in the cnpg-system
  # namespace. Set enabled to false when CloudNativePG is already installed
  # there (for example by provider-cloudnative-pg), and set INHERITED_LABELS in
  # that installation's configuration instead.
  cloudnative-pg:
    enabled: true
    config:
      data:
        # CloudNativePG copies these labels from a Cluster to its pods. The
        # provider labels the Cluster, since the DocumentDB resource has no pod
        # labels: OpenEverest finds an Instance's pods by them.
        INHERITED_LABELS: core.openeverest.io/*
